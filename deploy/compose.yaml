services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: nex
      POSTGRES_PASSWORD: nex
      POSTGRES_DB: nex_club
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nex -d nex_club"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - nex_pg:/var/lib/postgresql/data

  # api and worker images are added when those binaries are packaged.
  # api:
  #   build: { context: .., dockerfile: server/Dockerfile }
  #   env_file: ../.env
  #   depends_on: [postgres]
  # worker:
  #   build: { context: .., dockerfile: server/Dockerfile }
  #   env_file: ../.env
  #   depends_on: [postgres]

volumes:
  nex_pg:

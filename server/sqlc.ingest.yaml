version: "2"
sql:
  - engine: postgresql
    queries: db/queries/ingest
    schema:
      - db/schema/phase1.sql
      - db/schema/phase2.sql
      - db/schema/phase3.sql
      - db/schema/phase4.sql
      - db/schema/phase5.sql
    gen:
      go:
        package: sqlc
        out: internal/ingest/sqlc
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "pg_catalog.uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "pg_catalog.timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "jsonb"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
          - db_type: "pg_catalog.jsonb"
            go_type:
              import: "encoding/json"
              type: "RawMessage"

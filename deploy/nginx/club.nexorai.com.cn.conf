server {
    listen 80;
    listen [::]:80;
    server_name club.nexorai.com.cn;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/nex-club-acme;
        default_type text/plain;
    }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name club.nexorai.com.cn;
    ssl_certificate /etc/letsencrypt/live/club.nexorai.com.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/club.nexorai.com.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2m;
    access_log /var/log/nginx/nex-club.access.log;
    error_log /var/log/nginx/nex-club.error.log;
    location / {
        proxy_pass http://127.0.0.1:8089;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
    location = /mcp {
        proxy_pass http://127.0.0.1:8089;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 90s;
    }
}

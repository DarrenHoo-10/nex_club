name: nex-club
x-app: &app
  image: ${NEX_IMAGE:?Set NEX_IMAGE to the release image}
  restart: unless-stopped
  read_only: true
  tmpfs: ["/tmp:size=32m,mode=1777"]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}
  depends_on:
    postgres: {condition: service_healthy}
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: [./secrets/postgres.env]
    volumes: [postgres_data:/var/lib/postgresql/data]
    command: [postgres, -c, max_connections=60, -c, shared_buffers=128MB]
    shm_size: 128m
    mem_limit: 512m
    cpus: 0.75
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U nex_owner -d nex_club"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  api:
    <<: *app
    env_file: [./secrets/runtime.env]
    environment: {GOMEMLIMIT: 192MiB, GOMAXPROCS: "2"}
    mem_limit: 256m
    cpus: 0.5
    ports: [127.0.0.1:8089:8080]
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:8080/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
  worker:
    <<: *app
    entrypoint: [/app/worker]
    env_file: [./secrets/runtime.env]
    environment: {GOMEMLIMIT: 320MiB, GOMAXPROCS: "2"}
    mem_limit: 384m
    cpus: 0.75
    stop_grace_period: 30s
  migrate:
    <<: *app
    profiles: [tools]
    restart: "no"
    entrypoint: [/app/nexadm, migrate]
    env_file: [./secrets/migration.env]
    mem_limit: 256m
  admin:
    <<: *app
    profiles: [tools]
    restart: "no"
    entrypoint: [/app/nexadm]
    env_file: [./secrets/runtime.env]
    mem_limit: 256m
volumes:
  postgres_data:

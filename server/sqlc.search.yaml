version: "2"
sql:
  - engine: postgresql
    queries: db/queries/search
    schema: db/schema
    gen:
      go:
        package: sqlc
        out: internal/search/sqlc
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "pg_catalog.numeric"
            go_type: "string"
